<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="320" viewBox="0 0 1200 320" fill="none" role="img" aria-label="CastViewer — Espelhamento local ultra-rápido para Fire TV">
  <defs>
    <linearGradient id="cv_bg" x1="0" y1="0" x2="1200" y2="320" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#0A0A0C"/>
      <stop offset="55%" stop-color="#101014"/>
      <stop offset="100%" stop-color="#141112"/>
    </linearGradient>
    <radialGradient id="cv_orange_radial" cx="0.82" cy="0.48" r="0.48">
      <stop offset="0%" stop-color="#FF5A1F" stop-opacity="0.22"/>
      <stop offset="55%" stop-color="#FF5A1F" stop-opacity="0.06"/>
      <stop offset="100%" stop-color="#FF5A1F" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="cv_beam" x1="650" y1="160" x2="880" y2="160" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FF5A1F" stop-opacity="0.15"/>
      <stop offset="50%" stop-color="#FF5A1F" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="#22C55E" stop-opacity="0.95"/>
    </linearGradient>
    <pattern id="cv_grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M 32 0 L 0 0 0 32" fill="none" stroke="#FFFFFF" stroke-opacity="0.03" stroke-width="1"/>
    </pattern>
  </defs>

  <!-- Base Studio Canvas -->
  <rect width="1200" height="320" rx="18" fill="url(#cv_bg)"/>
  <rect width="1200" height="320" rx="18" fill="url(#cv_grid)"/>
  <rect width="1200" height="320" rx="18" fill="url(#cv_orange_radial)"/>
  <rect x="0.5" y="0.5" width="1199" height="319" rx="17.5" stroke="#FFFFFF" stroke-opacity="0.1"/>

  <!-- Left Identity Block -->
  <!-- Tactile App Emblem -->
  <rect x="64" y="64" width="68" height="68" rx="16" fill="#141418" stroke="#FFFFFF" stroke-opacity="0.14" stroke-width="1.2"/>
  <rect x="70" y="70" width="56" height="56" rx="12" fill="#FF5A1F" fill-opacity="0.12"/>
  <!-- Cast Waves + Screen Mark -->
  <rect x="81" y="84" width="34" height="24" rx="4" stroke="#FAFAFA" stroke-width="2.4"/>
  <path d="M84 114C89.5 114 94 118.5 94 124" stroke="#FF5A1F" stroke-width="2.4" stroke-linecap="round"/>
  <path d="M84 107C93.4 107 101 114.6 101 124" stroke="#FF5A1F" stroke-width="2.4" stroke-linecap="round"/>
  <circle cx="85" cy="123" r="2.2" fill="#FF5A1F"/>

  <!-- Brand Name -->
  <text x="150" y="96" fill="#FAFAFA" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="40" font-weight="800" letter-spacing="-0.03em">CastViewer</text>
  <rect x="396" y="71" width="94" height="24" rx="6" fill="#18181D" stroke="#FF5A1F" stroke-opacity="0.45"/>
  <circle cx="410" cy="83" r="3.5" fill="#FF5A1F"/>
  <text x="420" y="87" fill="#FF8A5B" font-family="'SF Mono', Consolas, ui-monospace, monospace" font-size="11.5" font-weight="700" letter-spacing="0.04em">LAN P2P</text>

  <text x="150" y="126" fill="#A1A1AA" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="17" font-weight="400">Espelhamento de tela e áudio sem nuvem para Fire TV</text>

  <!-- Telemetry / Feature Chips -->
  <rect x="64" y="166" width="510" height="44" rx="10" fill="#121216" stroke="#FFFFFF" stroke-opacity="0.09"/>
  <circle cx="84" cy="188" r="4.5" fill="#22C55E"/>
  <text x="98" y="192.5" fill="#E4E4E7" font-family="'SF Mono', Consolas, ui-monospace, monospace" font-size="13" font-weight="600">WebRTC Direto • H.264 HW + Opus • 1080p60 • 0 Cloud</text>

  <!-- Supported Platforms Row -->
  <g font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="600">
    <rect x="64" y="230" width="94" height="30" rx="8" fill="#16161B" stroke="#FFFFFF" stroke-opacity="0.1"/>
    <text x="111" y="249" fill="#E4E4E7" text-anchor="middle">Windows</text>

    <rect x="168" y="230" width="80" height="30" rx="8" fill="#16161B" stroke="#FFFFFF" stroke-opacity="0.1"/>
    <text x="208" y="249" fill="#E4E4E7" text-anchor="middle">Linux</text>

    <rect x="258" y="230" width="90" height="30" rx="8" fill="#16161B" stroke="#FFFFFF" stroke-opacity="0.1"/>
    <text x="303" y="249" fill="#E4E4E7" text-anchor="middle">Android</text>

    <rect x="358" y="230" width="92" height="30" rx="8" fill="#16161B" stroke="#FF5A1F" stroke-opacity="0.45"/>
    <text x="404" y="249" fill="#FF8A5B" text-anchor="middle">Fire TV</text>

    <rect x="460" y="230" width="114" height="30" rx="8" fill="#121216" stroke="#FFFFFF" stroke-opacity="0.08" stroke-dasharray="3 3"/>
    <text x="517" y="249" fill="#71717A" text-anchor="middle">iOS AirPlay *</text>
  </g>

  <!-- Right Minimalist Architecture Graphic -->
  <!-- Sender Card -->
  <rect x="628" y="72" width="176" height="176" rx="14" fill="#121216" stroke="#FFFFFF" stroke-opacity="0.12"/>
  <rect x="646" y="92" width="140" height="82" rx="8" fill="#0A0A0D" stroke="#FFFFFF" stroke-opacity="0.08"/>
  <!-- Abstract Window Preview -->
  <rect x="656" y="102" width="120" height="8" rx="3" fill="#1D1D24"/>
  <circle cx="662" cy="106" r="1.8" fill="#FF5A1F"/>
  <circle cx="668" cy="106" r="1.8" fill="#52525B"/>
  <rect x="656" y="116" width="76" height="46" rx="4" fill="#17171E"/>
  <rect x="738" y="116" width="38" height="46" rx="4" fill="#FF5A1F" fill-opacity="0.16" stroke="#FF5A1F" stroke-opacity="0.4"/>
  <text x="716" y="198" fill="#F4F4F5" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="700" text-anchor="middle">EMISSOR</text>
  <text x="716" y="218" fill="#A1A1AA" font-family="'SF Mono', Consolas, monospace" font-size="11" text-anchor="middle">PC · Linux · Android</text>
  <text x="716" y="234" fill="#71717A" font-family="'SF Mono', Consolas, monospace" font-size="10" text-anchor="middle">mDNS _firecast._tcp</text>

  <!-- LAN P2P Connection Beam -->
  <line x1="804" y1="160" x2="906" y2="160" stroke="url(#cv_beam)" stroke-width="2.5" stroke-dasharray="6 4"/>
  <polygon points="904,155 914,160 904,165" fill="#22C55E"/>
  <rect x="822" y="130" width="72" height="22" rx="6" fill="#18181D" stroke="#FFFFFF" stroke-opacity="0.12"/>
  <text x="858" y="144.5" fill="#FAFAFA" font-family="'SF Mono', Consolas, monospace" font-size="10.5" font-weight="700" text-anchor="middle">WS :8765</text>
  <rect x="824" y="168" width="68" height="20" rx="5" fill="#121216"/>
  <text x="858" y="181.5" fill="#22C55E" font-family="'SF Mono', Consolas, monospace" font-size="10" font-weight="600" text-anchor="middle">~4ms LAN</text>

  <!-- Fire TV Receiver Card -->
  <rect x="916" y="72" width="220" height="176" rx="14" fill="#141418" stroke="#FF5A1F" stroke-opacity="0.42" stroke-width="1.4"/>
  <rect x="932" y="88" width="188" height="104" rx="8" fill="#09090B" stroke="#FFFFFF" stroke-opacity="0.1"/>
  <!-- Live Broadcast Indicator -->
  <rect x="944" y="99" width="54" height="18" rx="4" fill="#FF5A1F" fill-opacity="0.18" stroke="#FF5A1F" stroke-opacity="0.5"/>
  <circle cx="953" cy="108" r="2.8" fill="#FF5A1F"/>
  <text x="960" y="111.5" fill="#FF8A5B" font-family="'SF Mono', Consolas, monospace" font-size="9.5" font-weight="700">AO VIVO</text>
  <text x="1086" y="111.5" fill="#22C55E" font-family="'SF Mono', Consolas, monospace" font-size="9.5" font-weight="700" text-anchor="middle">1080p60</text>
  <!-- Hardware Decode Bar -->
  <text x="1026" y="146" fill="#FAFAFA" font-family="system-ui, -apple-system, sans-serif" font-size="15" font-weight="700" text-anchor="middle">Fire TV</text>
  <text x="1026" y="166" fill="#A1A1AA" font-family="'SF Mono', Consolas, monospace" font-size="10.5" text-anchor="middle">MediaCodec DirectSurface</text>
  <!-- TV Stand -->
  <line x1="992" y1="200" x2="1060" y2="200" stroke="#52525B" stroke-width="2" stroke-linecap="round"/>
  <text x="1026" y="220" fill="#F4F4F5" font-family="system-ui, -apple-system, sans-serif" font-size="12.5" font-weight="600" text-anchor="middle">Receptor HDMI</text>
  <text x="1026" y="236" fill="#71717A" font-family="'SF Mono', Consolas, monospace" font-size="10" text-anchor="middle">H.264 / VP8 • Áudio Opus</text>
</svg>
