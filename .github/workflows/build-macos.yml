name: Build & Release CastViewer macOS

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Release tag to attach macOS Universal .dmg to'
        required: true
        default: 'v1.1.0'
      upload_to_release:
        description: 'Upload generated .dmg to GitHub Release'
        required: true
        type: boolean
        default: true
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build-macos:
    runs-on: macos-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: desktop-sender/package-lock.json

      - name: Install desktop-sender dependencies
        working-directory: desktop-sender
        run: npm ci

      - name: Run syntax checks & unit tests on macOS
        working-directory: desktop-sender
        run: npm run check

      - name: Build Universal macOS .dmg (arm64 + x64)
        working-directory: desktop-sender
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
        run: npx electron-builder --mac dmg --universal --publish never

      - name: Verify Universal binary architectures & Info.plist usage descriptions
        working-directory: desktop-sender
        run: |
          ls -lh dist/*.dmg
          if [ -d "dist/mac-universal/CastViewer.app" ]; then
            APP_DIR="dist/mac-universal/CastViewer.app"
          else
            APP_DIR=$(find dist -maxdepth 3 -name "CastViewer.app" -print | sed -n '1p')
          fi
          test -d "$APP_DIR"
          APP_BIN="$APP_DIR/Contents/MacOS/CastViewer"
          INFO_PLIST="$APP_DIR/Contents/Info.plist"
          lipo -info "$APP_BIN"
          lipo "$APP_BIN" -verify_arch x86_64 arm64
          /usr/libexec/PlistBuddy -c "Print :NSAudioCaptureUsageDescription" "$INFO_PLIST"
          /usr/libexec/PlistBuddy -c "Print :NSScreenCaptureUsageDescription" "$INFO_PLIST"
          /usr/libexec/PlistBuddy -c "Print :NSLocalNetworkUsageDescription" "$INFO_PLIST"

      - name: Upload workflow artifacts
        uses: actions/upload-artifact@v4
        with:
          name: castviewer-macos-universal-dmg
          path: desktop-sender/dist/*.dmg

      - name: Upload macOS Universal .dmg to GitHub Release
        if: |
          (github.event_name == 'workflow_dispatch' && inputs.upload_to_release == true) ||
          startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TARGET_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.release_tag || github.ref_name }}
        run: |
          if ! gh release view "$TARGET_TAG" >/dev/null 2>&1; then
            gh release create "$TARGET_TAG" --title "CastViewer $TARGET_TAG" --generate-notes || true
          fi
          gh release upload "$TARGET_TAG" desktop-sender/dist/*.dmg --clobber
